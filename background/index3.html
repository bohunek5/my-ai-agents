<!DOCTYPE html>
<html lang="pl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3. Reactive Tile Background</title>
    <style>
        body,
        html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #050505;
            font-family: sans-serif;
        }

        spline-viewer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            transform: scale(1.05);
            transform-origin: center center;
            transition: filter 0.5s ease-in-out;
            /* Płynne przejście kolorów */
        }

        spline-viewer::part(logo) {
            display: none !important;
        }

        /* Nawigacja Główna (Pliki) */
        .nav {
            position: absolute;
            top: 30px;
            left: 30px;
            z-index: 100;
            display: flex;
            gap: 15px;
        }

        .nav a {
            padding: 12px 25px;
            background: rgba(255, 255, 255, 0.1);
            color: rgba(255, 255, 255, 0.7);
            text-decoration: none;
            border-radius: 8px;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            font-weight: bold;
            letter-spacing: 1px;
            font-size: 14px;
            text-transform: uppercase;
        }

        .nav a.active {
            background: rgba(255, 255, 255, 0.3);
            color: white;
            border: 1px solid white;
        }

        /* Przełączniki Kolorów dla Reactive Tile */
        .color-switches {
            position: absolute;
            bottom: 30px;
            left: 30px;
            z-index: 100;
            display: flex;
            gap: 15px;
            background: rgba(0, 0, 0, 0.5);
            padding: 15px;
            border-radius: 12px;
            backdrop-filter: blur(10px);
        }

        .color-btn {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            border: 2px solid white;
            cursor: pointer;
            transition: transform 0.2s;
        }

        .color-btn:hover {
            transform: scale(1.1);
        }

        /* Kolory z obrazka */
        .c-default {
            background: #5a5a5a;
        }

        /* Oryginalny / Ciemny */
        .c-purple {
            background: #8a2be2;
        }

        /* Fioletowy motyw z SS */
        .c-cyan {
            background: #00e5ff;
        }

        /* Jasnoniebieski / Cyan motyw z SS */

        #logo-blocker {
            position: absolute;
            bottom: 10px;
            right: 10px;
            width: 170px;
            height: 50px;
            background: #050505;
            z-index: 9999;
            border-radius: 8px;
        }
    </style>
    <script type="module" src="https://unpkg.com/@splinetool/viewer@1.0.94/build/spline-viewer.js"></script>
</head>

<body>
    <div class="nav">
        <a href="index.html">Ethereal Rings</a>
        <a href="index2.html">Radiant Shift</a>
        <a href="index3.html" class="active">Reactive Background</a>
    </div>

    <spline-viewer id="my-spline" url="reactive_background.spline"></spline-viewer>

    <div class="color-switches">
        <button class="color-btn c-default" onclick="setColor('0deg')" title="Oryginał"></button>
        <button class="color-btn c-purple" onclick="setColor('270deg')" title="Fioletowy (Purple)"></button>
        <button class="color-btn c-cyan" onclick="setColor('180deg')" title="Jasnoniebieski (Cyan)"></button>
    </div>

    <div id="logo-blocker"></div>

    <script>
        // Zmieniamy kolor całego tła CSS Filterem (obrót na kole barw), symulując zmianę z obrazka!
        function setColor(hueDeg) {
            document.getElementById('my-spline').style.filter = `hue-rotate(${hueDeg})`;
        }

        // Blokada uciekającej kamery
        window.addEventListener("wheel", e => e.preventDefault(), { passive: false });
        window.addEventListener("touchmove", e => e.preventDefault(), { passive: false });
    </script>
</body>

</html>
