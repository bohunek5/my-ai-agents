<!DOCTYPE html>
<html lang="pl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>1. Ethereal Rings</title>
    <style>
        body,
        html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #050505;
            font-family: sans-serif;
        }

        spline-viewer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            transform: scale(1.05);
            /* likwiduje paski z boku */
            transform-origin: center center;
        }

        spline-viewer::part(logo) {
            display: none !important;
        }

        /* Nawigacja Główna */
        .nav {
            position: absolute;
            top: 30px;
            left: 30px;
            z-index: 100;
            display: flex;
            gap: 15px;
        }

        .nav a {
            padding: 12px 25px;
            background: rgba(255, 255, 255, 0.1);
            color: rgba(255, 255, 255, 0.7);
            text-decoration: none;
            border-radius: 8px;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            font-weight: bold;
            letter-spacing: 1px;
            font-size: 14px;
            text-transform: uppercase;
        }

        .nav a.active {
            background: rgba(255, 255, 255, 0.3);
            color: white;
            border: 1px solid white;
        }

        #logo-blocker {
            position: absolute;
            bottom: 10px;
            right: 10px;
            width: 170px;
            height: 50px;
            background: #050505;
            z-index: 9999;
            border-radius: 8px;
        }
    </style>
    <script type="module" src="https://unpkg.com/@splinetool/viewer@1.0.94/build/spline-viewer.js"></script>
</head>

<body>
    <div class="nav">
        <a href="index.html" class="active">Ethereal Rings</a>
        <a href="index2.html">Radiant Shift</a>
        <a href="index3.html">Reactive Background</a>
    </div>

    <spline-viewer url="Ethereal_Rings.spline"></spline-viewer>
    <div id="logo-blocker"></div>

    <script>
        window.addEventListener("wheel", e => e.preventDefault(), { passive: false });
        window.addEventListener("touchmove", e => e.preventDefault(), { passive: false });
    </script>
</body>

</html>
