<!DOCTYPE html>
<html lang="pl">

<head>
    <meta charset="UTF-8">
    <title>Gravity Pulse — Premium Ombre</title>
    <style>
        * {
            margin: 0;
            padding: 0;
        }

        body {
            background: #010103;
            overflow: hidden;
        }

        canvas {
            display: block;
        }

        #status {
            position: fixed;
            bottom: 25px;
            right: 25px;
            z-index: 100;
            display: flex;
            align-items: center;
            gap: 12px;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            padding: 12px 24px;
            border-radius: 40px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            font-size: 10px;
            font-weight: 600;
            color: rgba(255, 255, 255, 0.5);
            letter-spacing: 2.5px;
            text-transform: uppercase;
            transition: all 0.5s cubic-bezier(0.2, 1, 0.3, 1);
        }

        #status.speaking {
            border-color: rgba(0, 255, 180, 0.4);
            color: #00ffb4;
            transform: scale(1.05);
        }

        .dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: #333;
            transition: all 0.3s;
        }

        #status.speaking .dot {
            background: #00ffb4;
            box-shadow: 0 0 15px #00ffb4;
            animation: flash 0.6s infinite alternate;
        }

        @keyframes flash {
            from {
                opacity: 0.4;
                transform: scale(0.8);
            }

            to {
                opacity: 1;
                transform: scale(1.4);
            }
        }
    </style>
</head>

<body>
    <canvas id="c"></canvas>
    <div id="status">
        <div class="dot"></div>
        <span id="statusLabel">GRAVITY SYNC</span>
    </div>

    <script>
        const c = document.getElementById('c');
        const ctx = c.getContext('2d');

        function resize() {
            c.width = window.innerWidth;
            c.height = window.innerHeight;
            build();
        }
        window.addEventListener('resize', resize);

        let mx = window.innerWidth / 2, my = window.innerHeight / 2;
        window.addEventListener('mousemove', e => { mx = e.clientX; my = e.clientY; });

        // ── GRID CONFIG ───────────────────────────────────────────────
        const COLS = 44, ROWS = 28;
        let pts = [];

        function build() {
            pts = [];
            const gx = c.width / COLS;
            const gy = c.height / ROWS;
            for (let r = 0; r <= ROWS; r++) {
                for (let col = 0; col <= COLS; col++) {
                    pts.push({
                        ox: col * gx, oy: r * gy,
                        x: col * gx, y: r * gy,
                        z: 0,
                        vx: 0, vy: 0, vz: 0,
                        hue: (col / COLS) * 220 + (r / ROWS) * 80
                    });
                }
            }
        }
        resize();

        // ── VOICE PULSE SYSTEM (Discrete & Tasteful) ─────────────────
        let activePulses = [];
        let statusEl = document.getElementById('status');
        let labelEl = document.getElementById('statusLabel');
        let lastSpeak = false;

        async function pollSpeaking() {
            try {
                const r = await fetch('http://127.0.0.1:7777/speaking', { signal: AbortSignal.timeout(300) });
                const data = await r.json();

                if (data.speaking) {
                    statusEl.classList.add('speaking');
                    labelEl.textContent = 'ZOSIA SPEAKING';

                    // Spawn controlled pulse
                    if (!lastSpeak || Math.random() > 0.75) {
                        activePulses.push({
                            r: 0,
                            e: 1.0,
                            s: 4.5 // Elegant travel speed
                        });
                        if (activePulses.length > 5) activePulses.shift();
                    }
                } else {
                    statusEl.classList.remove('speaking');
                    labelEl.textContent = 'SYSTEM READY';
                }
                lastSpeak = data.speaking;
            } catch (e) { }
        }

        setInterval(pollSpeaking, 150);

        // ── ANIMATE ────────────────────────────────────────────────────
        let hueOff = 0;

        function tick() {
            ctx.fillStyle = '#010103';
            ctx.fillRect(0, 0, c.width, c.height);

            const cx = c.width / 2;
            const cy = c.height / 2;

            // Update pulses
            for (let i = activePulses.length - 1; i >= 0; i--) {
                const p = activePulses[i];
                p.r += p.s;
                p.e *= 0.985;
                if (p.e < 0.05) activePulses.splice(i, 1);
            }

            for (const p of pts) {
                // ── MOUSE DEPTH ──
                const dx = mx - p.x;
                const dy = my - p.y;
                const d = Math.sqrt(dx * dx + dy * dy) || 1;
                if (d < 220) {
                    const force = (220 - d) / 220;
                    p.vz += force * 1.5; // Lift towards viewer
                    p.vx += (dx / d) * force * 0.3;
                    p.vy += (dy / d) * force * 0.3;
                }

                // ── VOICE RIPPLES (Controlled Impact) ──
                const rx = p.ox - cx;
                const ry = p.oy - cy;
                const dist = Math.sqrt(rx * rx + ry * ry) || 1;

                for (const pulse of activePulses) {
                    const ringDist = Math.abs(dist - pulse.r);
                    if (ringDist < 60) {
                        const wave = (1 - ringDist / 60) * pulse.e;
                        // TASTEFUL impact, not "crazy"
                        const impact = wave * wave * 16;
                        p.vz += impact;
                        p.vx += (rx / dist) * impact * 0.15;
                        p.vy += (ry / dist) * impact * 0.15;
                    }
                }

                // ── PHYSICS (The "Gravity" feel) ──
                p.vx += (p.ox - p.x) * 0.04;
                p.vy += (p.oy - p.y) * 0.04;
                p.vz += (0 - p.z) * 0.1;

                const damping = 0.82;
                p.vx *= damping; p.vy *= damping; p.vz *= damping;

                p.x += p.vx; p.y += p.vy; p.z += p.vz;
            }

            const cols1 = COLS + 1;

            // ── DRAW LINES ──
            ctx.lineCap = 'round';
            for (let i = 0; i < pts.length; i++) {
                const p = pts[i];
                const col = i % cols1;
                const row = Math.floor(i / cols1);

                const hue = (p.hue + hueOff) % 360;
                const bright = Math.min(95, 65 + p.z * 0.4);
                const alpha = Math.min(0.6, 0.12 + p.z * 0.012);

                if (col < COLS) {
                    const p2 = pts[i + 1];
                    ctx.lineWidth = 0.4 + p.z * 0.015;
                    ctx.beginPath();
                    ctx.moveTo(p.x, p.y);
                    ctx.lineTo(p2.x, p2.y);
                    ctx.strokeStyle = `hsla(${hue}, 85%, ${bright}%, ${alpha})`;
                    ctx.stroke();
                }
                if (row < ROWS && pts[i + cols1]) {
                    const p3 = pts[i + cols1];
                    ctx.lineWidth = 0.4 + p.z * 0.015;
                    ctx.beginPath();
                    ctx.moveTo(p.x, p.y);
                    ctx.lineTo(p3.x, p3.y);
                    ctx.strokeStyle = `hsla(${(hue + 35) % 360}, 85%, ${bright}%, ${alpha})`;
                    ctx.stroke();
                }
            }

            // ── DRAW POINTS ──
            for (const p of pts) {
                const r = 1.3 + (p.z * 0.05);
                const hue = (p.hue + hueOff) % 360;
                const glow = Math.min(0.25, p.z * 0.008);

                if (p.z > 2) {
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, r * 4, 0, Math.PI * 2);
                    ctx.fillStyle = `hsla(${hue}, 100%, 60%, ${glow})`;
                    ctx.fill();
                }

                ctx.beginPath();
                ctx.arc(p.x, p.y, r, 0, Math.PI * 2);
                ctx.fillStyle = `hsla(${hue}, 100%, ${Math.min(98, 75 + p.z * 0.3)}%, ${0.7 + p.z * 0.005})`;
                ctx.fill();
            }

            hueOff = (hueOff + 0.08) % 360;
            requestAnimationFrame(tick);
        }

        tick();
    </script>
</body>

</html>
